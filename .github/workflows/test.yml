name: MAGNA3 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host tests with ASan and UBSan
        run: bash scripts/test_host.sh
  esphome:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested ESPHome
        run: python -m pip install esphome==2026.8.2
      - name: Use checkout for the public example
        run: python scripts/prepare_compile_example.py
      - name: Validate and compile example without hardware
        run: esphome compile .ci/grundfos-magna3.yaml
